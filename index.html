<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Mist Villa - Opening Soon</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: rgba(20, 20, 20, 0.7);
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #0b0b0b 100%);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            z-index: 2;
        }

        .badge {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            border-radius: 50px;
            background: rgba(212, 175, 55, 0.05);
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        h1 span {
            color: var(--gold);
            font-weight: 600;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 3rem;
            letter-spacing: 1px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .time-box {
            background: var(--card-bg);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 1.5rem 1rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .time-box span.number {
            display: block;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 0.3rem;
        }

        .time-box span.label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .footer-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .footer-info a {
            color: var(--gold);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .countdown-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Opening Soon</div>
        <h1>Sun Mist <span>Villa</span></h1>
        <p class="subtitle">Experience ultimate luxury, indoor games, and serene nature escapes. Opening our doors very soon.</p>

        <div class="countdown-grid">
            <div class="time-box">
                <span class="number" id="days">30</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div class="footer-info">
            Visit us at <a href="https://sunmist.site" target="_blank">sunmist.site</a>
        </div>
    </div>

    <script>
        // Target date set exactly 30 days from now
        const targetTime = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetTime - now;

            if (distance < 0) {
                document.querySelector(".container").innerHTML = `<h1>We Are <span>Now Open!</span></h1><p class="subtitle">Welcome to Sun Mist Villa.</p>`;
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
